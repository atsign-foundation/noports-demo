name: Web version

# Runs the demo for real on a GitHub machine, records it (./demo.sh record),
# and publishes the recording two ways:
#   - as a website on GitHub Pages
#   - as a container image, ghcr.io/atsign-foundation/noports-demo-web
# On a pull request it records and builds, to prove both still work, and
# publishes nothing.

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"   # Mondays: picks up a new NoPorts release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/atsign-foundation/noports-demo-web

jobs:
  record:
    name: Record the demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the demo and record it
        run: ./demo.sh record

      - name: Keep the website for the publish job
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the container image (and push it, unless this is a pull request)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: site
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  publish:
    name: Publish the website
    if: github.event_name != 'pull_request'
    needs: record
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
